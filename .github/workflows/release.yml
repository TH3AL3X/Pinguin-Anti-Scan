name: Build and release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Release new version
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read project version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content -Raw -LiteralPath "ScannerDisabler.csproj"
          $version = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "ScannerDisabler.csproj must contain a semantic version such as 1.4.1. Found: '$version'"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "Version detected: $version"

      - name: Check whether the release already exists
        id: existing_release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: process.env.RELEASE_TAG
              });
              core.setOutput('exists', 'true');
              core.notice(`Release ${process.env.RELEASE_TAG} already exists. Nothing to publish.`);
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('exists', 'false');
            }

      - name: Set up .NET
        if: steps.existing_release.outputs.exists == 'false'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        if: steps.existing_release.outputs.exists == 'false'
        shell: pwsh
        run: dotnet restore

      - name: Build portable executable
        if: steps.existing_release.outputs.exists == 'false'
        shell: pwsh
        run: dotnet build -c Release --no-restore -p:OutputPath="${{ github.workspace }}\release\"

      - name: Verify release contents
        if: steps.existing_release.outputs.exists == 'false'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath "release" -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne "PenguinAntiScan.exe") {
            $names = ($files.Name -join ', ')
            throw "Expected exactly one file named PenguinAntiScan.exe. Found: $names"
          }

          $actualVersion = $files[0].VersionInfo.ProductVersion
          $expectedVersion = "${{ steps.version.outputs.version }}"
          if ($actualVersion -ne $expectedVersion) {
            throw "Executable version '$actualVersion' does not match project version '$expectedVersion'."
          }

          $hash = (Get-FileHash -LiteralPath $files[0].FullName -Algorithm SHA256).Hash
          "SHA-256: $hash"
          "SHA256=$hash" >> $env:GITHUB_ENV

      - name: Upload workflow artifact
        if: steps.existing_release.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: PenguinAntiScan-${{ steps.version.outputs.version }}
          path: release/PenguinAntiScan.exe
          if-no-files-found: error

      - name: Create GitHub release
        if: steps.existing_release.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $notes = @"
          ## Penguin Anti-Scan $env:RELEASE_VERSION

          Download **PenguinAntiScan.exe** and run it. No installer or companion files are required.

          **SHA-256:** ``$env:SHA256``
          "@

          gh release create $env:RELEASE_TAG "release\PenguinAntiScan.exe" `
            --target $env:GITHUB_SHA `
            --title "Penguin Anti-Scan $env:RELEASE_VERSION" `
            --notes $notes
